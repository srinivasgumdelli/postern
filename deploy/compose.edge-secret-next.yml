# Edge secret rotation overlay. It gives the relay a second, optional
# edge secret, the one the edge's transform rule is about to switch to,
# so that requests carrying either secret pass while the rule changes.
# Use it only between the two restarts of a rotation, together with
# "edge_secret_next_file": "/run/secrets/edge_secret_next" in
# deploy/relay.json (docs/edge-setup.md, "Edge secret rotation"):
#
#   docker compose -f docker-compose.yml -f deploy/compose.edge-secret-next.yml up -d --force-recreate relay
#
# Paths resolve against the project directory (the repo root), as in
# docker-compose.yml. deploy/secrets/edge-secret-next comes from
# `deploy/scripts/gen-edge-secret.sh --next` and is gitignored. Only the
# relay gets it; never add ports, networks or other services here.
# cmd/postern-relay/compose_test.go enforces this.

services:
  relay:
    # Mounted at /run/secrets/edge_secret_next.
    secrets:
      - source: edge_secret_next
        target: edge_secret_next

secrets:
  edge_secret_next:
    file: ./deploy/secrets/edge-secret-next
